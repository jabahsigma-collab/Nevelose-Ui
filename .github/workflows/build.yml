name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Find project directory
        id: proj
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)" ]; then
            z=$(find . -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$z" ]; then echo "Unzipping $z"; mkdir -p /tmp/unz && unzip -q -o "$z" -d "$GITHUB_WORKSPACE/_project"; fi
          fi
          f=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$f" ]; then echo "settings.gradle.kts not found. Files in repo:"; find . -not -path "./.git/*" | head -50; exit 1; fi
          dir=$(dirname "$f")
          echo "Project dir: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
